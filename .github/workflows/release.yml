# v1.2.3 처럼 v로 시작하는 태그를 올리면 유니버설 앱을 빌드해 GitHub Release에 zip으로 올린다.
#   git tag v1.0.0 && git push origin v1.0.0
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15   # Swift 6 (BitwiseCopyable) 필요
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app
        run: VERSION="${GITHUB_REF_NAME#v}" ./build.sh universal
      - name: Zip
        run: ditto -c -k --keepParent build/ClawdPet.app ClawdPet.zip
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: ClawdPet.zip
          generate_release_notes: true
          body: |
            **Install**: unzip `ClawdPet.zip`, move `ClawdPet.app` to Applications and open it.

            **If macOS says "ClawdPet" Not Opened … could not verify it is free of malware** (the app isn't signed with a paid Apple developer ID, so this shows once):
            1. Click **Done**.
            2. Open **System Settings → Privacy & Security**, scroll down, and click **Open Anyway** next to "ClawdPet was blocked". Enter your password.
            3. Open the app again. It won't ask after that.

            Or in Terminal: `xattr -d com.apple.quarantine /Applications/ClawdPet.app`

            ---

            **설치**: `ClawdPet.zip`을 풀고 `ClawdPet.app`을 응용 프로그램 폴더로 옮겨 엽니다.

            **"ClawdPet을 열지 않음 … 악성 코드가 없음을 확인할 수 없습니다" 창이 뜨면** (개발자 서명 없이 배포하는 앱이라 처음 한 번 뜹니다)
            1. 그 창에서 **완료**를 누릅니다.
            2. **시스템 설정 → 개인정보 보호 및 보안**으로 가서 아래로 내리면 "ClawdPet이(가) 차단되었습니다" 옆에 **그래도 열기**가 있습니다. 누르고 비밀번호를 넣습니다.
            3. 다시 앱을 엽니다. 그 뒤로는 묻지 않습니다.

            터미널이 편하면 `xattr -d com.apple.quarantine /Applications/ClawdPet.app` 한 줄로도 됩니다.
